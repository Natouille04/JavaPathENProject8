name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilation
        run: mvn -B compile

      - name: Tests (hors tests de performance)
        run: mvn -B test -Dtest='!TestPerformance'

      - name: Build des artefacts
        run: mvn -B package -DskipTests

      - name: Archivage du jar généré
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-jar
          path: target/*.jar
